<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOSET ARCHIVE | サービス企画プレゼンテーション</title>
    <!-- グローバルテーマとフォントの読み込み -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* プレゼンテーションページ専用の上質で静かなデザイン調整 */
        body {
            background-color: var(--bg-primary);
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }

        .presentation-page-container {
            width: 100%;
            max-width: 1150px; /* 文字拡大に伴い、画面幅上限を広げて優雅な余白を維持 */
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        .presentation-viewport {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            aspect-ratio: 16/10;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .presentation-slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: var(--space-xl) var(--space-xxl);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            background-color: var(--bg-secondary);
            box-sizing: border-box;
        }

        .presentation-slide.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* スライド内構造 */
        .slide-header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: var(--space-sm);
        }

        .slide-tag {
            font-size: 12px; /* 10pxから拡大 */
            text-transform: uppercase;
            letter-spacing: 0.18em; /* 視認性向上のためやや広げる */
            color: var(--accent-color);
            font-weight: 600;
        }

        .slide-title {
            font-family: var(--font-title);
            font-size: 32px; /* 26pxから拡大 */
            font-weight: 500;
            letter-spacing: 0.05em;
            color: var(--text-primary);
            margin-top: var(--space-xxs);
        }

        .slide-body {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-md) 0;
        }

        .slide-body-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-xl);
            width: 100%;
        }

        .slide-body-text h3 {
            font-size: 20px; /* 16pxから拡大 */
            font-weight: 600;
            margin-bottom: var(--space-xs);
            color: var(--text-primary);
            border-left: 2px solid var(--accent-color);
            padding-left: var(--space-xs);
        }

        .slide-body-text p {
            font-size: 16px; /* 13pxから拡大 */
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: var(--space-sm);
        }

        .slide-body-text ul {
            list-style-type: none;
            margin-top: var(--space-sm);
        }

        .slide-body-text li {
            font-size: 16px; /* 13pxから拡大 */
            color: var(--text-secondary);
            position: relative;
            padding-left: var(--space-md);
            margin-bottom: var(--space-xs);
        }

        .slide-body-text li::before {
            content: '—';
            position: absolute;
            left: 0;
            color: var(--accent-color);
        }

        .slide-visual-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: var(--space-md);
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 14px; /* 12pxから拡大 */
        }

        .slide-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: var(--space-sm);
            font-size: 12px; /* 10pxから拡大 */
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        /* テーブル */
        .slide-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px; /* 12pxから拡大 */
        }

        .slide-table th {
            text-align: left;
            padding: var(--space-xs);
            border-bottom: 1px solid var(--accent-color);
            color: var(--text-primary);
            font-weight: 600;
        }

        .slide-table td {
            padding: var(--space-xs);
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        /* ツールバー */
        .presentation-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .slide-controls {
            display: flex;
            align-items: center;
            gap: var(--space-md);
        }

        .slide-counter {
            font-family: var(--font-title);
            font-size: 15px; /* 13pxから拡大 */
            color: var(--text-secondary);
            letter-spacing: 0.1em;
        }

        /* --- 10. A4横印刷（スライド用）スタイル --- */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }

            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                height: 100% !important;
                overflow: hidden !important;
            }

            .presentation-page-container {
                width: 100% !important;
                max-width: 100% !important;
                padding: 0 !important;
                margin: 0 !important;
                display: block !important;
            }

            .presentation-toolbar,
            .theme-toggle-btn {
                display: none !important;
            }

            .presentation-viewport {
                border: none !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                height: auto !important;
                display: block !important;
                background-color: #ffffff !important;
            }

            .presentation-slide {
                page-break-after: always !important;
                page-break-inside: avoid !important;
                width: 297mm !important;
                /* A4横幅 */
                height: 210mm !important;
                /* A4縦幅 */
                margin: 0 !important;
                padding: 15mm !important;
                /* 余白を狭めてコンテンツ領域を確保 */
                box-sizing: border-box !important;
                overflow: hidden !important;
                /* はみ出しによる改ページを完全に遮断 */
                background-color: #ffffff !important;
                position: relative !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: space-between !important;
                opacity: 1 !important;
                pointer-events: auto !important;
                left: auto !important;
                top: auto !important;
            }

            .slide-title {
                color: #000000 !important;
                font-size: 28px !important; /* 印刷用タイトルサイズ適正化 */
            }

            .slide-body-text h3 {
                font-size: 18px !important;
            }

            .slide-body-text p,
            .slide-body-text li {
                color: #333333 !important;
                font-size: 14px !important; /* 印刷用本文サイズ適正化 */
            }

            .slide-visual-card {
                background-color: #f5f5f4 !important;
                border: 1px solid #d6d3d1 !important;
                font-size: 12px !important;
            }
        }

        /* --- 11. スマートフォン対応レスポンシブ表示 --- */
        @media (max-width: 768px) {
            body {
                padding: var(--space-sm);
                align-items: flex-start;
            }

            .presentation-page-container {
                gap: var(--space-sm);
            }

            .presentation-viewport {
                aspect-ratio: auto;
                min-height: 580px; /* 文字サイズ拡大に合わせて最小高を少し高めに調整 */
            }

            .presentation-slide {
                padding: var(--space-md);
            }

            .slide-title {
                font-size: 24px; /* 20pxから拡大 */
            }

            .slide-body {
                padding: var(--space-xs) 0;
            }

            .slide-body-grid {
                grid-template-columns: 1fr;
                gap: var(--space-md);
            }

            .slide-body-text h3 {
                font-size: 18px; /* 14pxから拡大 */
            }

            .slide-body-text p,
            .slide-body-text li {
                font-size: 14px; /* 12pxから拡大 */
                line-height: 1.6;
            }

            .slide-visual-card {
                padding: var(--space-sm);
                font-size: 13px; /* 拡大 */
            }

            .slide-footer {
                font-size: 11px; /* 9pxから拡大 */
            }

            .presentation-toolbar {
                flex-direction: column;
                gap: var(--space-sm);
                align-items: stretch;
            }

            #btn-print-slides {
                justify-content: center;
            }

            .slide-controls {
                justify-content: space-between;
                width: 100%;
            }
        }
    </style>
</head>

                                    <p>「日常のコーデ記録を残すアクティブ層」から「いいね等のSNS競争を嫌い、個人的なファッション日記として静かに振り返りたい層」まで、多様な愛着のグラデーションに寄り添います。</p>
                                </div>
                                <div class="slide-visual-card" style="padding: 0; overflow: hidden; justify-content: center; align-items: center; border: 1px solid var(--border-color); background-color: var(--bg-primary); display: flex; height: 100%;">
                                    <img src="screenshot.png" alt="CLOSET ARCHIVE Application Interface Mockup" style="width: 100%; height: 100%; object-fit: cover; display: block;">
                                </div>
                            </div>
                        `
                    },
                    {
                        tag: 'Outlook',
                        title: 'Future Outlook',
                        content: `
                            <div class="slide-body-grid">
                                <div class="slide-body-text">
                                    <h3>Seamless Integration</h3>
                                    <p>主要ECや店頭POSとAPI連携し、購入した服が自動的にクローゼットへ同期。登録の手間をゼロにし、日常に溶け込むインフラへ発展します。</p>

                                    <p>長期間着用していない死蔵アイテムを、クローゼットからワンタップで二次流通市場やブランド回収プログラムへ繋ぐ循環モデルを構築します。</p>
                                </div>
                                <div class="slide-visual-card" style="justify-content: center; gap: var(--space-xs); padding: var(--space-lg); border-style: dashed; border-color: var(--accent-color);">
                                    <h4 style="font-family: var(--font-title); font-size: 13px; color: var(--accent-color); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; margin-bottom: 6px;">Future Roadmap</h4>
                                    <ul style="list-style: none; padding: 0; margin: 0; font-size: 12px; color: var(--text-secondary); display: flex; flex-direction: column; gap: 6px; text-align: left; line-height: 1.4;">
                                        <li><strong>・3D & AR Closet</strong>: 仮想空間での衣服試着・デジタルアセット保管</li>
                                        <li><strong>・AI Stylist</strong>: 気温や予定、気分に連動したスマートな着回し自動提案</li>
                                        <li><strong>・Fashion Timeline</strong>: 年代ごとのスタイル変化の年表自動生成</li>

                                    </ul>
                                    <div style="border-top: 1px dashed var(--border-color); padding-top: 6px; font-size: 11px; color: var(--text-muted); line-height: 1.5; margin-top: 6px; text-align: left;">

                    }
                ];

                this.initDom();
                this.initEvents();
                this.render();
            }

            /**
             * DOM要素の初期化とスライドHTMLの生成
             */
            initDom() {
                const container = document.getElementById('slides-container');
                const slidesHtml = this.slides.map((s, index) => `
                    <div class="presentation-slide">
                        <div class="slide-header">
                            <span class="slide-tag">${s.tag}</span>
                            <h2 class="slide-title">${s.title}</h2>
                        </div>
                        <div class="slide-body">
                            ${s.content}
                        </div>
                        <div class="slide-footer">
                            <span>CLOSET ARCHIVE Concept Paper</span>
                            <span>${index + 1} / ${this.slides.length}</span>
                        </div>
                    </div>
                `).join('');

                container.innerHTML = slidesHtml;
            }

            /**
             * 前後のスライドへ遷移する
             */
            changeSlide(direction) {
                const nextIndex = this.currentSlide + direction;
                if (nextIndex >= 0 && nextIndex < this.slides.length) {
                    this.currentSlide = nextIndex;
                    this.render();
                }
            }

            /**
             * 描画の反映
             */
            render() {
                const slides = document.querySelectorAll('.presentation-slide');
                slides.forEach((slide, index) => {
                    if (index === this.currentSlide) {
                        slide.classList.add('active');
                    } else {
                        slide.classList.remove('active');
                    }
                });

                document.getElementById('slide-counter').textContent = `${this.currentSlide + 1} / ${this.slides.length}`;
            }

            /**
             * イベントリスナーの初期設定
             */
            initEvents() {
                // ボタンコントロール
                document.getElementById('btn-prev-slide').addEventListener('click', () => this.changeSlide(-1));
                document.getElementById('btn-next-slide').addEventListener('click', () => this.changeSlide(1));
                document.getElementById('btn-print-slides').addEventListener('click', () => window.print());

                // キーボード制御
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === ' ') {
                        e.preventDefault();
                        this.changeSlide(1);
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.changeSlide(-1);
                    }
                });
            }
        }

        // DOMロード完了時にコントローラーをインスタンス化
        document.addEventListener('DOMContentLoaded', () => {
            new PresentationController();
        });
    </script>
